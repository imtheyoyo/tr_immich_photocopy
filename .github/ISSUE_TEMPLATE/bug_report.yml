name: Bug report
description: Something in Immich PhotoCopy isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: input
    id: immich
    attributes:
      label: immich version
      placeholder: e.g. 3.3.5
    validations:
      required: true
  - type: input
    id: nas
    attributes:
      label: NAS / OS
      placeholder: e.g. UGREEN DXP4800 Plus, UGOS 1.21.0.0190
    validations:
      required: true
  - type: input
    id: photocopy
    attributes:
      label: Immich PhotoCopy version
      placeholder: e.g. v1.0, or commit
  - type: textarea
    id: logs
    attributes:
      label: Container log
      description: Output of `docker logs photocopy` around the problem. Remove API keys and passwords first.
      render: text
